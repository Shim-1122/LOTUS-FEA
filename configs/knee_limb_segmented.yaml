# LOTUS FEA: full residual limb from the supplied segmented STLs (data/limb).
# Same materials, contact, loads and solver settings as the earlier
# supplied-limb run; the socket now has four petals (current design), and the anatomy changed:
#   * skin and fat thickness are MEASURED per skin vertex from the segmented
#     inner skin surface and the outer muscle surface (no longer assumed);
#   * four bones, including a candidate tibia (part_1) that was missing before.
# Bone identities are heuristic (shape/size/position); confirm them.
run_name: knee_limb_4petal_T75
geometry:
  source: files
  patient_data: false   # published by the owner's decision (see data/limb/README.md)
  skin:
    path: ../data/limb/skin.stl
    unit: mm
    component: 0          # outer skin surface (the file holds outer + inner shells)
    name: skin_envelope
  segmented_layers:
    skin_inner: {path: ../data/limb/skin.stl, unit: mm, component: 1}
    fat_inner: {path: ../data/limb/muscle.stl, unit: mm, component: 0}
    note: skin inner surface = fat outer surface; muscle outer surface = fat inner surface
  bones:
  - name: tibia_candidate
    path: ../data/limb/part_1.stl
    unit: mm
    role: tibia (HEURISTIC label, unconfirmed; 150 mm long, cavity in muscle.stl)
  - name: femur_candidate
    path: ../data/limb/part_2.stl
    unit: mm
    role: distal femur (HEURISTIC label, unconfirmed)
  - name: patella_candidate
    path: ../data/limb/part_3.stl
    unit: mm
    role: patella (HEURISTIC label, unconfirmed; cavity in muscle.stl)
  - name: fibula_candidate
    path: ../data/limb/part_4.stl
    unit: mm
    role: fibula (HEURISTIC label, unconfirmed; slender, posterolateral to part_1)
  expected_bones:
  - tibia
  - fibula
  alignment:
    method: axes
    proximal_hint: [0, 0, 1]
    anterior_hint: [0, -1, 0]
  remesh:
    skin_size: {value: 9.0, unit: mm}
    bone_size: {value: 6.0, unit: mm}
layers:
  skin_thickness: {value: 1.5, unit: mm}   # unused when segmented_layers is given
  fat_thickness: {value: 3.0, unit: mm}    # unused when segmented_layers is given
  max_fraction_total: 0.9
  skin_fiber_reference: circumferential
  muscle_formulation: ut4
materials:
  set: materials/human_tissue.yaml
  regions: {skin: skin, fat: fat, muscle: muscle, proximal_cap: muscle,
            silicone_pad: silicone_pad, distal_cushion: distal_cushion}
  bones: rigid
supports:
  bones:
    femur_candidate: fixed
    tibia_candidate: fixed
    fibula_candidate: fixed
    patella_candidate: free
  proximal_cut: axial_roller
load_model: resolved_contact
socket:
  enabled: true
  n_petals: 4   # current design: four petals, centred anterior, medial/lateral and posterior (90, 180, 270, 0 deg)
  gap_deg: 8
  z_base:
    value: 40
    unit: mm
  z_top:
    value: 160
    unit: mm
  posterior_clearance_drop:
    value: 25
    unit: mm
  tip_drop:
    value: 12
    unit: mm
  pad_thickness:
    value: 3.0
    unit: mm
  shell_thickness:
    value: 4.0
    unit: mm
  initial_gap:
    value: -0.1
    unit: mm
  element_size:
    value: 8.0
    unit: mm
  cushion_thickness:
    value: 6.0
    unit: mm
  cup_thickness:
    value: 4.0
    unit: mm
  stabilizer_k:
    value: 0.05
    unit: N/mm
contact:
  type: sliding-elastic
  friction: 0.5
  augmented_lagrangian: false
  penalty_scale: 0.1
tension_basis: design
cable:
  strand_tension:          # design line tension (docs/GRIP_ESTIMATE.md); replaces the earlier 75 N placeholder
    value: 60
    unit: lbf
  design_source: "docs/GRIP_ESTIMATE.md (walking stance peak x 1.3 headroom, petals >= 85%)"
  tension_is_example: false
  rated_tension: null
  rating_fractions:
  - 0.25
  - 0.5
  - 0.75
  - 1.0
  guide_friction: 0.0
  routing: default
  route_height_fraction: 0.75
load_cases:
  tightening:
    enabled: true
  pullout:
    enabled: true
    displacement:
      value: 2.0
      unit: mm
solver:
  n_steps: 50
  max_retries: 10
  max_ups: 0
  etol: 0.01   # FEBio default; 1e-3 stalled on a friction stick-slip 2-cycle at t=0.645 (run supplied_limb_T75_newton)

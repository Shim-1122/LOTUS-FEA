# Scenario A: human residual-limb tissue.
# Every parameter carries value + unit + source.  Conversions between the
# source's strain-energy convention and FEBio's are stated explicitly.
set_name: human_tissue_v2
scenario: A_human_tissue
references:
  NiAnnaidh2012:
    citation: "Ni Annaidh A, Bruyere K, Destrade M, Gilchrist MD, Maurini C, Ottenio M, Saccomandi G. Automated estimation of collagen fibre dispersion in the dermis and its contribution to the anisotropic behaviour of skin. Ann Biomed Eng. 2012;40(8):1666-78."
    doi: "10.1007/s10439-012-0542-3"
  Sengeh2016:
    citation: "Sengeh DM, Moerman KM, Petron A, Herr H. Multi-material 3-D viscoelastic model of a transtibial residuum from in-vivo indentation and MRI data. J Mech Behav Biomed Mater. 2016;59:379-392."
    doi: "10.1016/j.jmbbm.2016.02.020"
  Ranger2022:
    citation: "Ranger BJ, Moerman KM, Anthony BW, Herr HM. Constitutive parameter identification of transtibial residual limb soft tissue using ultrasound indentation and shear wave elastography. J Mech Behav Biomed Mater (2023); preprint arXiv:2211.13023 (2022)."
    doi: "10.48550/arXiv.2211.13023"
    use: "Shear-wave-elastography shear moduli of transtibial residual-limb soft tissue (predominantly muscle), 7.4-11.7 kPa at the indentation sites; 3 residual limbs of 2 amputees; Ogden fits c = 5.4-10.5 kPa."
  Mukhina2020:
    citation: "Mukhina E, Rohan P-Y, Connesson N, Payan Y. Calibration of the fat and muscle hyperelastic material parameters for the assessment of the internal tissue deformation in relation to pressure ulcer prevention. Comput Methods Biomech Biomed Engin. 2020;23(sup1)."
    doi: "10.1080/10255842.2020.1813426"
    use: "First-order Ogden, exponent alpha = 5 for fat and muscle; fat mu = 6.55 kPa (case 2, total and muscle thickness matched; 9.64 kPa in case 1). One subject (buttock, in vivo)."
  Steer2020:
    citation: "Steer JW, Worsley PR, Browne M, Dickinson A. Key considerations for finite element modelling of the residuum-prosthetic socket interface. Prosthet Orthot Int. 2020;45(2):138-146."
    doi: "10.1177/0309364620967781"
    use: "Bulk residuum soft-tissue range: flaccid neo-Hookean C = 2.3-6.2 kPa (Palevski, mu = 2C = 4.6-12.4 kPa) to contracted C = 8.1 kPa (Hoyt, mu = 16.2 kPa). Used for the muscle uncertainty range."
  ReillyBurstein1975:
    citation: "Reilly DT, Burstein AH. The elastic and ultimate properties of compact bone tissue. J Biomech. 1975;8(6):393-405."
    doi: "10.1016/0021-9290(75)90075-5"
  Sanders2004:
    citation: "Sanders JE, Nicholson BS, Zachariah SG, Cassisi DV, Karchin A, Fergason JR. Testing of elastomeric liners used in limb prosthetics: classification of 15 products by mechanical performance. J Rehabil Res Dev. 2004;41(2):175-186."
    doi: null
    url: "https://www.rehab.research.va.gov/jour/04/41/2/sanders.html"
    kind: approximation
    use: "Silicone GEL liner products (EasyLiner ELDT 32-6, EasyLiner Super Stretch, Alpha Liner, SiloLiner, DERMO Liner-6): linear shear G = 19.3-52.9 kPa (median 23.3), tensile H = 30.4-76.1 kPa. Used as a generic approximation for the team's medical-grade gel-liner silicone, not a test of that product."
  ReppelWeinberg2018:
    citation: "Reppel T, Weinberg K. Experimental determination of elastic and rupture properties of printed Ninjaflex. Technische Mechanik. 2018;38(1):104-112."
    doi: "10.24352/UB.OVGU-2018-010"
    kind: approximation
    use: "NinjaFlex is an 85A Shore TPU; its printed-specimen Mooney-Rivlin fit stands in for the team's 85A TPU cushion (material match, NOT inferred from Shore hardness; infill/print settings differ)."
  GyroidHomogenisationApprox:
    citation: "Approximation: Gibson-Ashby cellular-solid scaling E*/Es = C (rho*)^n with C = 1 and n = 2 (bending-dominated lattice) applied to 8% gyroid infill of 85A TPU (Es from Reppel & Weinberg 2018). Range n = 1.5 (stretch/sheet-like) to C = 0.5 gives 36-252 kPa. Gibson LJ, Ashby MF. Cellular Solids: Structure and Properties, 2nd ed., Cambridge University Press, 1997."
    doi: "10.1017/CBO9781139878326"
    kind: approximation
  TissueBulkRatioApprox:
    citation: "Approximation: soft-tissue bulk modulus taken as 100 x shear modulus (nu = 0.495), the common near-incompressibility choice in residuum FE models (e.g. Steer et al. 2020 use nu = 0.495)."
    doi: "10.1016/j.jmbbm.2016.02.020"
    kind: approximation
  MuscleIncompressibleApprox:
    citation: "Approximation (team requirement, 2026-10-26): skeletal muscle is mostly water and is treated as incompressible, so its volume must not change under compression while it still deforms in shape. Enforced by a penalty bulk modulus of 1000 x the Sengeh 2016 shear modulus on UT4 (nodally integrated) tetrahedra; FEBio 4.13 offers no augmented-Lagrangian incompressibility option for the uncoupled Ogden material."
    doi: null
    kind: approximation
  PriorPackageAssumption:
    citation: "Supplied handoff package 03_Previous_Tissue_Analysis (silicone mu = 100 kPa listed as an assumed material; no measurement)."
    doi: null
materials:
  skin:
    model: HGO
    febio_type: "Holzapfel-Gasser-Ogden"
    region: skin
    parameters:
      c:     {value: 0.2014, unit: MPa, source: NiAnnaidh2012, note: "source mu; FEBio ground matrix W = c/2 (I1~ - 3), so c = mu (Abaqus C10 = mu/2)"}
      k1:    {value: 24.53,  unit: MPa, source: NiAnnaidh2012, note: "source reports k1 = 243.6 in its own normalisation (anisotropic term scaled by mu) and gives the ABAQUS value 24.53 MPa; that ABAQUS value is used. FEBio and ABAQUS share W_f = k1/(2 k2) sum(exp(k2 E^2) - 1). The source's own text implies 0.2014*243.6 = 49.06 MPa under its Eq. 3; this ambiguity is carried as the upper uncertainty bound."}
      k2:    {value: 0.1327, unit: "-",  source: NiAnnaidh2012}
      kappa: {value: 0.1404, unit: "-",  source: NiAnnaidh2012, note: "dispersion, 0 <= kappa <= 1/3"}
      gamma: {value: 41.0,   unit: deg,  source: NiAnnaidh2012, note: "angle of each fibre family from local axis e1 (FEBio gamma). Mapping of Langer lines on the lower leg to e1 is an ASSUMPTION (see fiber_reference_axis)."}
      k:     {value: 20.14,  unit: MPa,  source: TissueBulkRatioApprox, note: "bulk modulus = 100 c, the human soft-tissue ratio used for fat and muscle (approximation). FEBio HGO uses U = k/2((J^2-1)/2 - ln J) (= ABAQUS GOH with D = 2/k)."}
    calibration_range: "Uniaxial tension, excised BACK skin, donors aged 81 and 89; small-strain mu from < 2% strain; nonlinear fit to ~50% strain. Not lower-leg, not in vivo, not compression."
    uncertainty:
      c: [0.10, 0.40]
      k1: [12.0, 49.06]
    applicability: "Thin dermal layer with tension-only fibres. Large uncertainty for in-vivo residual-limb skin."
  fat:
    model: Ogden2_symmetric
    febio_type: "Ogden"
    region: fat
    parameters:
      c1: {value: 0.00655, unit: MPa, source: Mukhina2020, note: "FEBio Ogden with c1 = c2 = mu and m2 = -m1 has small-strain shear modulus mu; mu = 6.55 kPa (Mukhina 2020 case 2)"}
      m1: {value: 5.0,     unit: "-", source: Mukhina2020, note: "Ogden exponent alpha = 5 (fixed in the source)"}
      c2: {value: 0.00655, unit: MPa, source: Mukhina2020}
      m2: {value: -5.0,    unit: "-", source: Mukhina2020}
      k:  {value: 0.655,   unit: MPa, source: TissueBulkRatioApprox, note: "bulk = 100 mu (near-incompressible)"}
    calibration_range: "In-vivo indentation inverse FE (buttock, 1 subject). Not residual-limb specific; replaces Sengeh 2016 at the team's request (2026-10-26)."
    uncertainty:
      c1: [0.00655, 0.00964]
  muscle:
    model: Ogden2_symmetric
    febio_type: "Ogden"
    region: muscle
    parameters:
      c1: {value: 0.0095, unit: MPa, source: Ranger2022, note: "small-strain shear modulus mu = 9.5 kPa, the middle of the shear-wave-elastography range measured in transtibial residual limbs (7.4-11.7 kPa)"}
      m1: {value: 5.0,    unit: "-", source: Mukhina2020, note: "Ogden exponent alpha = 5 for muscle (Mukhina 2020): strain stiffening in compression"}
      c2: {value: 0.0095, unit: MPa, source: Ranger2022}
      m2: {value: -5.0,   unit: "-", source: Mukhina2020}
      k:  {value: 9.5,    unit: MPa, source: MuscleIncompressibleApprox, note: "muscle is incompressible (team requirement): penalty bulk modulus k = 1000 mu (nu = 0.4995); see the README muscle check"}
    calibration_range: "Residual-limb soft tissue (predominantly muscle), relaxed, in vivo; 3 limbs, 2 amputees (Ranger 2022). Replaces Sengeh 2016 at the team's request (2026-10-26)."
    uncertainty:
      c1: [0.0074, 0.0162]
    passive_anisotropy:
      enabled: false
      note: "No calibrated passive-muscle fibre parameters with provenance are supplied."
  bone_deformable:
    model: neo_Hookean_compressible
    febio_type: "neo-Hookean"
    region: bone
    parameters:
      E: {value: 17000.0, unit: MPa, source: ReillyBurstein1975, note: "human cortical bone, longitudinal; applied to the WHOLE bone volume (cortical/trabecular not distinguished) - simplification"}
      v: {value: 0.30,    unit: "-", source: ReillyBurstein1975}
    calibration_range: "Small-strain cortical bone specimens."
  silicone_pad:
    model: Mooney_Rivlin_uncoupled
    febio_type: "Mooney-Rivlin"
    region: "socket silicone interface: standard medical-grade silicone of the kind used in gel liners"
    parameters:
      c1: {value: 0.01165, unit: MPa, source: Sanders2004, note: "neo-Hookean (c2 = 0): FEBio uncoupled Mooney-Rivlin small-strain shear modulus mu = 2(c1 + c2); mu = 23.3 kPa = median linear shear stiffness G of the five silicone-gel liner products in Sanders 2004 (range 19.3-52.9 kPa)"}
      c2: {value: 0.0,     unit: MPa, source: Sanders2004, note: "neo-Hookean choice: the source reports linear fits only"}
      k:  {value: 2.33,    unit: MPa, source: TissueBulkRatioApprox, note: "silicone gels are near-incompressible; k = 100 mu by the same convention as the tissues"}
    calibration_range: "Sanders 2004: linear shear fits to ~30 kPa shear stress; tension linear fits; compression to ~200 kPa, where gels stiffen strongly (sigma = A e + B (e - C)^D, A = 6-108 kPa, B = 224-837 kPa, C = 0.01-0.21). A neo-Hookean model does NOT reproduce that compressive stiffening, so pad compression under high pressure is overestimated."
    uncertainty:
      c1: [0.00965, 0.02643]
  distal_cushion:
    model: neo_Hookean_compressible
    febio_type: "neo-Hookean"
    region: "socket distal cushion: 85A TPU printed with 2 walls and 8% gyroid infill (homogenised)"
    parameters:
      E: {value: 0.071, unit: MPa, source: GyroidHomogenisationApprox, note: "E* = Es (rho*)^2 with Es = 6 (c1 + c2) = 11.1 MPa (small-strain Young's modulus of the NinjaFlex 85A fit, c1 = 0.385, c2 = 1.47 MPa, Reppel & Weinberg 2018) and rho* = 0.08 (gyroid infill)."}
      v: {value: 0.3,   unit: "-",  source: GyroidHomogenisationApprox, note: "a sparse lattice is compressible (it is NOT near-incompressible like solid TPU); typical foam Poisson ratio"}
    calibration_range: "NONE for this print. Small-strain estimate only: a gyroid lattice in compression is linear, then plateaus, then densifies at large strain, which neo-Hookean does not capture. The 2 walls (perimeters) are not resolved; under through-thickness compression they act in series with the core and add little, but they stiffen the edges. Compress a printed cushion to calibrate."
    uncertainty:
      E: [0.036, 0.252]
  petal_stop:
    model: neo_Hookean_compressible
    febio_type: "neo-Hookean"
    region: "socket hinge-stop bumper (model device that limits petal rotation; not tissue)"
    parameters:
      E: {value: 2000.0, unit: MPa, source: assumption, note: "stiff nylon-like bumper so the rotation limit is sharp"}
      v: {value: 0.3,    unit: "-", source: assumption}
    calibration_range: "Model device; its stiffness only sets how sharply the rotation limit acts."

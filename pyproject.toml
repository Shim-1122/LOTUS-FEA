[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlfea"
version = "0.1.0"
description = "Residual-limb finite element analysis: geometry audit, layered full-limb meshing, FEBio nonlinear solves, solver-field visualisation and reproducible reports"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=2.0", "scipy>=1.12", "gmsh>=4.13", "meshio>=5.3", "trimesh>=4.4", "rtree>=1.3",
  "pyvista>=0.44", "vtk>=9.3", "matplotlib>=3.8", "pyyaml>=6.0",
]
[project.optional-dependencies]
gui = ["trame>=3", "trame-vtk>=2.8", "trame-vuetify>=2.7", "trame-pyvista"]
test = ["pytest>=8"]

[project.scripts]
rlfea = "rlfea.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["febio: requires the FEBio executable", "slow: long-running full-limb test"]
